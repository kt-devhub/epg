name: Update Guide

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  update-guide:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v3
        if: ${{ !env.ACT }}
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Grab data from SITES and channels
        run: |
          npm run grab --- --site=tv.cctv.com
          npm run grab --- --site=programme.tvb.com --lang=zh
          npm run grab --- --channels=user_channels.xml

      - name: Adjust Timezone to +0800
        run: |
          sed -i 's/ +0000/ +0800/g' guide.xml

      - name: Commit and push changes
        run: |
          TIMESTAMP=$(date +"%y-%m-%d %-I %p")
          git add guide.xml
          git commit -m "Update guide.xml - $TIMESTAMP"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
